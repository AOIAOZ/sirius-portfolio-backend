name: Django CI

on:
  push:
    branches: [ "main", "shvdev1-b2d4755-patch" ]
  pull_request:
    branches: [ "main", "shvdev1-b2d4755-patch" ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: default
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5  # Updated to v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Wait for PostgreSQL
        run: |
          # Wait for postgres service to be healthy
          for i in {1..30}; do
            if docker compose ps --services --filter "health=healthy" | grep -q postgres; then
              echo "PostgreSQL is healthy!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Tests
        run: |
          python manage.py test
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_HOST: postgres
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          # Explicitly set TEST settings to avoid postgres DB
          DB_TEST_NAME: test_${{ secrets.POSTGRES_DB }}
